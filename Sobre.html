<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            list-style: none;
            text-decoration: none;
        }

        :root{
            --red:#ffffff;
            --white:#2257CB;
            --dark:#1e1c2a;
        }

        body{
            color: var(--red);
            background: var(--white);
        }

        /* NAVBAR */

        .navigation{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            box-shadow: 0 0.1rem 0.5rem #2257CB;
            width: 100%;
            background: var(--white);
            transition: all 0.5s;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navigation .logo{
            color: var(--red);
            font-size: 1.7rem;
            font-weight: 600;
        }

        .logo span{
            color: rgb(126, 185, 240);
        }

        .navigation ul{
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .navigation ul li a{
            color: var(--red);
            font-size: 17px;
            font-weight: 500;
            transition: all 0.5s;
        }

        .navigation ul li a:hover{
            color: #f7e600;
        }

        .navigation i{
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--red);
        }

        /* MENU MOBILE */

        .menu{
            cursor: pointer;
            display: none;
        }

        .menu .bar{
            display: block;
            width: 28px;
            height: 3px;
            border-radius: 3px;
            background: var(--red);
            margin: 5px auto;
            transition: all 0.3s;
        }

        /* HOME */

        .home{
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 120px 10% 50px;
            gap: 3rem;
        }

        .home-text{
            max-width: 37rem;
        }

        .home-text .text-h4{
            font-size: 1.8rem;
            color: var(--red);
            margin-bottom: 1rem;
        }

        .home-text p{
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .home-btn{
            padding: 15px 45px;
            background: var(--red);
            color: var(--white);
            border-radius: 10px;
            font-weight: 700;
            transition: 0.3s;
        }

        .home-btn:hover{
            background: #f7e600;
            color: #000;
        }

        /* IMAGEM */

        .home-img{
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-img img{
            width: 100%;
            max-width: 450px;
            height: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .home-img img:hover{
            transform: scale(1.05);
        }

        /* RESPONSIVO */

        @media (max-width:785px){

            .navigation{
                padding: 18px 20px;
            }

            .menu{
                display: block;
            }

            .nav-menu{
                position: fixed;
                right: -100%;
                top: 70px;
                width: 100%;
                height: 100vh;
                flex-direction: column;
                background: var(--white);
                gap: 20px;
                transition: 0.3s;
                padding-top: 40px;
            }

            .nav-menu.ativo{
                right: 0;
            }

            .nav-item{
                margin: 16px 0;
            }

            .home{
                flex-direction: column;
                text-align: center;
                padding: 120px 5% 50px;
                gap: 3rem;
            }

            .home .text-h4{
                font-size: 1.4rem;
            }

            .home p{
                font-size: 15px;
            }

            .home-img{
                width: 100%;
            }

            .home-img img{
                max-width: 300px;
            }

            .home-btn{
                padding: 15px 35px;
                font-weight: 500;
            }
        }

    </style>
</head>

<body>

    <header>
        <nav class="navigation">

            <a href="#" class="logo">
                Wi<span>Find</span>
            </a>

            <ul class="nav-menu">

                <li class="nav-item">
                    <a href="home page.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a href="#">Sobre</a>
                </li>

                <li class="nav-item">
                    <a href="Contato.html">Contato</a>
                </li>

                <i class='bx bx-search'></i>

            </ul>

            <div class="menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

        </nav>
    </header>

    <main>

        <section class="home">

            <div class="home-text">

                <h4 class="text-h4">
                    Bem vindo ao WiFind
                </h4>

                <p>
                    Somos sua melhor escolha!
                </p>

                <a href="Site tim.html" class="home-btn">
                    Acessar WiFind
                </a>

            </div>

            <div class="home-img">

                <img 
                    src="logoPNG.png"
                    alt="Imagem sobre"
                >

            </div>

        </section>

    </main>

</body>

</html>
