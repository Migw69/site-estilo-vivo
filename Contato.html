<style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    /* Estilos Gerais */
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
        list-style: none;
        text-decoration: none;
    }
    :root{
        --primary-color: #2257CB;
        --secondary-color: #1e1c2a;
        --light-color: #fff;
        --dark-color: #333;
    }
    body{
        color: var(--dark-color);
        background: #2257CB;
    }

    /* Navegação */
    .navigation{
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
        box-shadow: 0 0.1rem 0.5rem #2257CB;
        width: 100%;
        background: var(--primary-color);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
    }
    .logo{
        font-size: 1.7rem;
        font-weight: 600;
        color: var(--light-color);
    }
    .logo span{
        color: rgb(126, 185, 240)
    }
    .nav-menu{
        display: flex;
        align-items: center;
        gap: 2rem;
    }
    .nav-item a{
        font-size: 1rem;
        color: var(--dark-color);
        font-weight: 500;
        transition: color 0.3s;
    }
    .nav-item a:hover{
        color: var(--light-color);
    }
    .menu{
        display: none;
    }
    .bx-search{
        cursor: pointer;
        font-size: 1.5rem;
        color: var(--dark-color);
    }

    /* Home */
    .home{
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10%;
        margin-top: 70px;
    }
    .home-text{
        max-width: 40%;
    }
    .text-h4{
        font-size: 1.5rem;
        color: var(--light-color);
        margin-bottom: 1rem;
    }
    .text-h1{
        font-size: 3rem;
        margin-bottom: 1rem;
        line-height: 1.2;
    }
    .home-btn{
        display: inline-block;
        padding: 15px 30px;
        background: var(--primary-color);
        color: var(--light-color);
        border-radius: 5px;
        font-weight: 700;
        transition: background 0.3s;
    }
    .home-btn:hover{
        background: #2257CB;
    }
    .home-img img{
        width: 100%;
        max-width: 500px;
    }

    /* Últimas Notícias */
    .latest-news{
        padding: 50px 10%;
    }
    .section-title{
        font-size: 2rem;
        margin-bottom: 2rem;
        text-align: center;
    }
    .news-grid{
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2rem;
    }
    .news-item{
        background: var(--light-color);
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .news-item img{
        width: 100%;
        border-radius: 5px;
        margin-bottom: 1rem;
    }
    .news-item h3{
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }
    .news-item p{
        font-size: 1rem;
        color: var(--dark-color);
    }

    /* Footer */
    footer{
        background: var(--secondary-color);
        color: var(--light-color);
        text-align: center;
        padding: 20px 0;
    }

    /* Responsividade */
    @media (max-width: 768px){
        .navigation{
            padding: 10px 20px;
        }
        .home{
            flex-direction: column;
            text-align: center;
        }
        .home-text{
            max-width: 100%;
        }
        .home-img{
            margin-top: 20px;
        }
    }

    @media (max-width: 576px){
        .nav-menu{
            display: none;
        }
        .menu{
            display: block;
        }
    }
</style>
